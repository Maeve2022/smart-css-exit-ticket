<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Collaborative computer maintenance</title>
<desc id="desc">Two computer systems servicing learners work together. One learner cleans a desktop computer while the other records inspection findings on a clipboard.</desc>
