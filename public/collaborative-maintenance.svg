 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#0b2c65"/><stop offset="1" stop-color="#168ad4"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00163d" flood-opacity=".35"/></filter>
</defs>
